<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Memory Game</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div id="newGame"><button onclick="newGame()">New Game</button></div>
    <div id="startGame" style="display: none;">
      <form style="width: fit-content; margin: auto;">
        <div class="text-center">
          <h5><u>Settings</u></h5>
        </div>
        <div><label>Game Mode</label></div>
        <div>
          <select id="gamemode" onchange="changeGamemode(event)">
            <option value="s0" title="Match two copies of a card">Two of a kind</option>
            <option value="s1" title="Match three copies of a card">Three of a kind</option>
            <option value="s2" title="Match four copies of a card">Four of a kind</option>
            <option value="s3" title="Match two copies of a card">Double</option>
            <option value="s4" title="Match two copies of a card, alternating turns">Duel</option>
          </select>
        </div>
        <div id="s0"></div>
        <div id="s1"></div>
        <div id="s2"></div>
        <div id="s3"></div>
        <div id="s4"></div>
      </form>
    </div>
    <div id="mainGame" style="display: none;"></div>
    <script src="" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
<script>
  var element = document.getElementById('s0');
  /*
  ids = ['s0', 's1', 's2', 's3', 's4']
  funcs = [f0, f1, f2, f3, f4]
  ids.forEach(x, i => document.getElementById(x).innerHTML = funcs[i])
  element = document.getElementById('s0');
  element.innerHTML = func1();
  */
  function newGame(){
    document.getElementById('newGame').style.display = 'none';
    document.getElementById('startGame').style.display = 'block';
    return
  }
  function startGame() {
    document.getElementById('startGame').style.display = 'none';
    document.getElementById('mainGame').style.display = 'block';
    return
  }
  function changeGamemode(event){
    element.style.display = 'none';
    element = document.getElementById(event.target.value);
    element.style.display = 'block';
    return
  }
  function gm1html() {
    return `
      <div><label>Number of players</label></div>
      <div>
        <select id="nplayers">
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
        </select>
      </div>
      <div><label>Player 2 difficulty</label></div>
      <div>
        <select id="p2diff">
          <option>Easy</option>
          <option>Medium</option>
          <option>Hard</option>
        </select>
      </div>
      <div><label>Player 3 difficulty</label></div>
      <div>
        <select id="p3diff">
          <option>Easy</option>
          <option>Medium</option>
          <option>Hard</option>
        </select>
      </div>
      <div><label>Player 4 difficulty</label></div>
      <div>
        <select id="p4diff">
          <option>Easy</option>
          <option>Medium</option>
          <option>Hard</option>
        </select>
      </div>
      <div class="text-center">
        <h5><u>Modifiers</u></h5>
      </div>
      <div title="Skip a turn" class="form-check">
        <input class="form-check-input" type="checkbox" />
        <label class="form-check-label">Pass</label>
      </div>
      <div title="The player that found a match does not get an additional turn" class="form-check">
        <input class="form-check-input" type="checkbox" />
        <label class="form-check-label">No Replay</label>
      </div>
      <div title="Cards will swap positions when closed" class="form-check">
        <input class="form-check-input" type="checkbox" />
        <label class="form-check-label">Card Switch Position</label>
      </div>
      <div title="Cards must be matched in a specific order" class="form-check">
        <input class="form-check-input" type="checkbox" />
        <label class="form-check-label">Opening Sequence</label>
      </div>
      <div><p></p></div>
      <div class="text-center"><button type="button" onclick="gm1start()">Start Game</button></div>
    `
    }

    function gm1start() { }
  
</script>
